<div
  style="
    width: 450px;
    height: 560px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 8px;
    gap: 8px;
    background: #d6e1eb;
    color: #edf6ff;
    font-family: Orbitron;
    letter-spacing: 0.02em;
    overflow: hidden;
  "
>
  <!-- Header-->
  <div
    style="
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px 20px;
      border: 2px solid #89b0d4;
      border-radius: 6px;
      background: #284761;
      color: #edf6ff;
      box-shadow: inset 0 0 0 1px #1b3144;
    "
  >
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        justify-content: space-between;
      "
    >
      <div
          id="displayName"
          style="
            font-size: 28px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            word-break: break-word;
          "
        >
          Navasi
        </div>
      <div
        id="status"
        style="
          text-align: center;
          font-size: 8px;
          font-weight: 900;
          padding: 4px 8px;
          border-radius: 999px;
          background: #d8e7f5;
          border: 2px solid #8fb7d8;
          color: #18374e;
        "
      >
        CURRENT
      </div>
    </div>
  </div>
  <!-- Body -->
  <div
    style="
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      border: 3px solid #86abc9;
      border-radius: 6px;
      background: #24313d;
      box-shadow: inset 0 0 0 1px #4d708f;
      overflow: hidden;
    "
  >
    <!-- Panel grid-->
    <div
      style="
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 8px;
      "
    >
      <!-- Health -->
      <div
        style="
          display: flex;
          gap: 8px;
          flex: 0 0 auto;
        "
      >
        <!-- HP -->
        <div
          style="
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            border: 1px solid #557893;
            border-radius: 4px;
            background: #314250;
          "
        >
          <div
            style="
              font-size: 12px;
              font-weight: 700;
              color: #a2c3df;
              letter-spacing: 0.12em;
              text-transform: uppercase;
            "
          >
            HP
          </div>
          <div
            id="hp"
            style="
              font-size: 22px;
              font-weight: 700;
            "
          >
            18/18
          </div>
        </div>
        <!-- SP -->
        <div
          style="
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            border: 1px solid #557893;
            border-radius: 4px;
            background: #314250;
          "
        >
          <div
            style="
              font-size: 12px;
              font-weight: 700;
              color: #a2c3df;
              letter-spacing: 0.12em;
              text-transform: uppercase;
            "
          >
            SP
          </div>
          <div
            id="stamina"
            style="
              font-size: 22px;
              font-weight: 700;
            "
          >
            12/12
          </div>
        </div>
        <!-- RP -->
        <div
          style="
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            border: 1px solid #557893;
            border-radius: 4px;
            background: #314250;
          "
        >
          <div
            style="
              font-size: 12px;
              font-weight: 700;
              color: #a2c3df;
              letter-spacing: 0.12em;
              text-transform: uppercase;
            "
          >
            RP
          </div>
          <div
            id="resolve"
            style="
              font-size: 22px;
              font-weight: 700;
            "
          >
            4/4
          </div>
        </div>
      </div>
      <!-- Conditions -->
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 8px;
          border: 1px solid #557893;
          border-radius: 4px;
          background: #314250;
          flex: 0 0 auto;
        "
      >
        <div
          style="
            font-size: 12px;
            font-weight: 700;
            color: #a2c3df;
            letter-spacing: 0.12em;
            text-transform: uppercase;
          "
        >
          Conditions
        </div>
        <div
          id="conditionsDisplay"
          style="
            font-size: 17px;
            font-weight: 600;
            word-break: break-word;
          "
        >
          Off-kilter
        </div>
      </div>
      <div
        style="
          display: flex;
          gap: 8px;
        "
      >
        <!-- Initiative -->
        <div
          style="
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            border: 1px solid #557893;
            border-radius: 4px;
            background: #314250;
          "
        >
          <div
            style="
              font-size: 12px;
              font-weight: 700;
              color: #a2c3df;
              letter-spacing: 0.12em;
              text-transform: uppercase;
            "
          >
            Initiative
          </div>
          <div
            id="initiative"
            style="
              font-size: 20px;
              font-weight: 700;
            "
          >
            +4
          </div>
        </div>
        <!-- Armour -->
        <div
          style="
            display: flex;
            flex: 2;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
            border: 1px solid #557893;
            border-radius: 4px;
            background: #314250;
          "
        >
          <div
            style="
              font-size: 12px;
              font-weight: 700;
              color: #a2c3df;
              letter-spacing: 0.12em;
              text-transform: uppercase;
            "
          >
            Armor
          </div>
          <div
            style="
              display: flex;
              gap: 8px;
              align-items: baseline;
              flex-wrap: wrap;
              font-size: 14px;
              font-weight: 600;
            "
          >
            <span style="color: #a2c3df;">EAC</span>
            <span id="eac">15</span>
            <span style="color: #a2c3df; font-weight: 700; font-size: 1.2em">|</span>
            <span style="color: #a2c3df;">KAC</span>
            <span id="kac">16</span>
          </div>
        </div>
      </div>
      <!-- Saves -->
      <div
        style="
          display: flex;
          flex: 0 0 auto;
          flex-direction: column;
          gap: 8px;
          padding: 8px;
          border: 1px solid #557893;
          border-radius: 4px;
          background: #314250;
        "
      >
        <div
          style="
            font-size: 12px;
            font-weight: 700;
            color: #a2c3df;
            letter-spacing: 0.12em;
            text-transform: uppercase;
          "
        >
          Saves
        </div>
        <div
          style="
            display: flex;
            gap: 8px;
            align-items: baseline;
            flex-wrap: wrap;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.35;
          "
        >
          <span style="color: #a2c3df;">Fort</span>
          <span id="fort">+4</span>
          <span style="color: #a2c3df; font-weight: 700; font-size: 1.2em">|</span>
          <span style="color: #a2c3df;">Ref</span>
          <span id="ref">+6</span>
          <span style="color: #a2c3df; font-weight: 700; font-size: 1.2em">|</span>
          <span style="color: #a2c3df;">Will</span>
          <span id="will">+2</span>
        </div>
      </div>
      <!-- Weapon -->
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 8px;
          border: 1px solid #557893;
          border-radius: 4px;
          background: #314250;
        "
      >
        <div style="
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: baseline;
            font-size: 14px;
            font-weight: 700;
            word-break: break-word;
        ">
          <span style="
            font-weight: 700;
            color: #a2c3df;
            letter-spacing: 0.12em;
          ">
            WEAPON:
          </span>
          <span
            id="weaponName"
            style="
              font-weight: 700;
              word-break: break-word;
            ">
            Laser Pistol
          </span>
        </div>
        <div
          style="
            display: flex;
            gap: 8px;
            font-size: 14px;
          "
        >
          <div
            style="
              display: flex;
              gap: 4px;
              align-items: baseline;
              flex-wrap: wrap;
            "
          >
            <span style="color: #a2c3df;">ATK</span> <span id="weaponAttack">+4</span>
          </div>
          <span style="color: #a2c3df; font-weight: 700;">|</span>
          <div
            style="
              display: flex;
              gap: 4px;
              align-items: baseline;
              flex-wrap: wrap;
            "
          >
            <span style="color: #a2c3df;">DMG</span> <span id="weaponDamage">1d4 + LEV</span>
          </div>
          <span style="color: #a2c3df; font-weight: 700;">|</span>
          <div
            style="
              display: flex;
              gap: 4px;
              align-items: baseline;
              flex-wrap: wrap;
            "
          >
            <span style="color: #a2c3df;">CRIT</span> <span id="weaponCritical">Burn 1d4</span>
          </div>
        </div>
        <div
          style="
            display: flex;
            gap: 8px;
            font-size: 14px;
          "
        >
          <div
            style="
              display: flex;
              gap: 4px;
              align-items: baseline;
              flex-wrap: wrap;
            "
          >
            <span style="color: #a2c3df;">Range</span> <span id="range">80ft</span>
          </div>
          <span style="color: #a2c3df; font-weight: 700;">|</span>
          <div
            style="
              display: flex;
              gap: 4px;
              align-items: baseline;
              flex-wrap: wrap;
            "
          >
            <span style="color: #a2c3df;">Ammo</span> <span id="weaponAmmo">52 / 1-20</span>
          </div>
        </div>
      </div>
    </div>
</div>
